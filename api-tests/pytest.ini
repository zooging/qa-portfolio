[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: быстрая проверка доступности сервиса
    regression: стабильные сценарии CRUD и поиска
    negative: негативные и граничные сценарии
    contract: проверка JSON-схемы ответа
    performance: проверка времени отклика
    bug: тест на известный дефект (xfail до исправления API)
